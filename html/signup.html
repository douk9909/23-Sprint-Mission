<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입 | 판다마켓</title>
    <link rel="stylesheet" href="../css/loginstyle.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <!-- 로고 -->
        <header class="login-header">
          <img src="../images/logo.png" alt="판다마켓 로고" class="logo-icon" />
          <a href="../html/index.html">
            <h1 class="logo-text">판다마켓</h1>
          </a>
        </header>

        <!-- 회원가입 폼 -->
        <form class="login-form">
          <div class="input-group">
            <label for="email">이메일</label>
            <input type="email" id="email" placeholder="codeit@email.com" />
          </div>

          <div class="input-group">
            <label for="nickname">닉네임</label>
            <input type="text" id="nickname" placeholder="판다" />
          </div>

          <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" />
          </div>

          <div class="input-group">
            <label for="password-check">비밀번호 확인</label>
            <input type="password" id="password-check" />
          </div>

          <button type="submit" class="login-button">회원가입</button>
        </form>

        <!-- 로그인 이동 -->
        <p class="signup-text">
          이미 회원이신가요?
          <a href="./login.html">로그인</a>
        </p>
      </section>
    </main>
  </body>
</html>
